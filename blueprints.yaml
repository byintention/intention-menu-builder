name: Intention Menu Builder
slug: intention-menu-builder
type: plugin
version: 1.0.0
description: Named menus for Admin2 with internal/external items, custom labels, and drag reorder
icon: bars
author:
  name: Intention
  email: admin@fcswebsites.co.uk
keywords: grav, plugin, menu, navigation, admin2
license: MIT
gpm: false

dependencies:
  - { name: grav, version: '>=2.0.0-rc.1' }
  - { name: api, version: '>=1.0.0-rc.1' }

compatibility:
  grav:
    - '2.0'

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
